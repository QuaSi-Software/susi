services:
  susi:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./:/opt/susi
    pre_start:
      - command: [ "sh", "-c", "npm install" ]
        user: "${LOCAL_UID:-1000}"
    ports:
      - "5002:5002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
